[package]
name = "own-domains-desktop"
version = "0.1.0-beta.3"
edition.workspace = true
rust-version.workspace = true

[dependencies]
own-domains-client = { path = "../own-domains-client" }
own-domains-protocol = { path = "../own-domains-protocol" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
own-domains-core = { path = "../own-domains-core" }
own-domains-daemon = { path = "../own-domains-daemon" }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-build"]

[dependencies.tauri]
version = "=2.12.4"
optional = true
features = ["tray-icon"]

[dependencies.tauri-plugin-single-instance]
version = "=2.5.4"
optional = true

[build-dependencies.tauri-build]
version = "=2.7.3"
optional = true
features = []

[[bin]]
name = "own-domains-desktop"
path = "src/main.rs"
required-features = ["desktop"]
