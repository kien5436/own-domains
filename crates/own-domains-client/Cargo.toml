[package]
name = "own-domains-client"
version = "0.1.0-beta.2"
edition.workspace = true
rust-version.workspace = true

[dependencies]
own-domains-protocol = { path = "../own-domains-protocol" }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
own-domains-core = { path = "../own-domains-core" }
own-domains-daemon = { path = "../own-domains-daemon" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }
